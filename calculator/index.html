<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="calculator" role="application" aria-label="Basic calculator">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div id="expression" class="expression">0</div>
          <div id="result" class="result"></div>
        </div>

        <div class="keys" id="keys">
          <button class="key key--fn" data-action="clear" title="All Clear">AC</button>
          <button class="key key--fn" data-action="backspace" title="Backspace">⌫</button>
          <button class="key key--op" data-value="%" data-operator="true">%</button>
          <button class="key key--op" data-value="÷" data-operator="true">÷</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key key--op" data-value="×" data-operator="true">×</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key key--op" data-value="-" data-operator="true">-</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key key--op" data-value="+" data-operator="true">+</button>

          <button class="key key--wide" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key key--equals" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
